<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MA Phone">
  <meta name="theme-color" content="#f7f6f0">
  <title>MA Phone — BEST MA IN THE WORLD</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div><p class="eyebrow">BEST MA IN THE WORLD</p><h1 id="screen-title" tabindex="-1">Main screen</h1><p id="page-count" class="page-count">1 of 3</p></div>
      <button id="home" class="home" type="button" aria-label="Home — main screen"><span aria-hidden="true">⌂</span> HOME</button>
    </header>
    <main id="main" aria-labelledby="screen-title">
      <p id="load-status" role="status">Opening Ma’s phone…</p>
      <div id="tiles" class="tiles"></div>
      <p id="screen-note" class="screen-note"></p>
      <p id="connection" role="status" class="connection" hidden></p>
    </main>
    <footer class="footer"><button id="emergency" type="button" class="emergency"><span aria-hidden="true">✚</span> EMERGENCY 000</button></footer>
  </div>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description" hidden>
    <div class="dialog">
      <p id="dialog-kicker" class="eyebrow"></p><h2 id="dialog-title"></h2><p id="dialog-description"></p>
      <div class="dialog-actions"><button id="cancel" type="button" class="cancel">GO BACK</button><a id="confirm" class="confirm" hidden></a></div>
      <button id="dialog-home" type="button" class="dialog-home">HOME — MAIN SCREEN</button>
    </div>
  </div>
  <noscript><p class="noscript">Ma’s launcher needs JavaScript. Use the native Phone app for calls and emergency access.</p></noscript>
</body>
</html>
